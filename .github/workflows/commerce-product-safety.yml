name: Commerce product safety
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check commerce.js
      - run: node --check server.js
      - run: node scripts/check-product-cart.js
