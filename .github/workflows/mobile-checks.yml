name: Mobile app checks
on:
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile-checks.yml']
  push:
    branches: [main, feat/suqaena-mobile-app]
    paths: ['mobile/**', '.github/workflows/mobile-checks.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run export
